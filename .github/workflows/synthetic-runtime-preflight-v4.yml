name: Synthetic runtime preflight V4

# Only the one-use request-file push can start this bounded software test.
# No general push, pull-request, schedule, dispatch, or inference service.
on:
  push:
    branches: [main]
    paths: [runtime-preflight/requests/qualification-v4.json]

permissions: {}

concurrency:
  group: synthetic-runtime-preflight-v4
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.repository == 'johnsbartholomew-star/ccc-Testing-areas' && github.event.repository.private == false && github.run_attempt == 1 && github.event.head_commit.message == 'Execute synthetic runtime preflight V4 once' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      LLAMA_COMMIT: 23b0202a189c44a54625aadcb37a946dd1d6278d
      MODEL_REPOSITORY: ggml-org/SmolLM3-3B-GGUF
      MODEL_REVISION: 4965cb60b150737b68a0408c36aeefb65078f894
      MODEL_FILE: SmolLM3-Q4_K_M.gguf
      MODEL_SHA256: 8334b850b7bd46238c16b0c550df2138f0889bf433809008cc17a8b05761863e
      PROMPT_TOKENS_MIN: '49152'
      GENERATION_RESERVE: '4096'
      CONTEXT_TOKENS: '53248'
      OMP_NUM_THREADS: '4'
    steps:
      - name: Retrieve this repository's exact public test revision
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          git init --quiet test-source
          git -C test-source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C test-source fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C test-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C test-source rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify frozen repository-local test sources
        shell: bash
        run: |
          set -euo pipefail
          cd test-source
          sha256sum --check runtime-preflight/SHA256SUMS-v4
          python3 --version
          cmake --version
          c++ --version
      - name: Execute repository-local synthetic qualification
        shell: bash
        run: |
          set -euo pipefail
          cd test-source
          timeout --signal=TERM --kill-after=10s 7800s python3 runtime-preflight/qualify-v4.py

# No artifact upload, cache, package publication, model service, secrets,
# paid runner, or automatic retry. Measurements belong in the bounded job log.
